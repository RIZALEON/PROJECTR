<div>R:\&gt; RTOR signal transponder — sends every signal type this iPhone can give. Starfield Law seat. ONE RULE: never erase a skill or memory.</div>

<script>
const ALLOW=['17e','neo','pixel','ubuntu-touch','moto','rvm']; const SEAT=(localStorage.getItem('rklowd3-seat')||'17e'); if(!ALLOW.includes(SEAT)){document.addEventListener('DOMContentLoaded',()=>{document.getElementById('out').textContent='RNETWORK-HARDEN-1: seat '+SEAT+' is NOT on the ASSM allowlist — REFUSED.'})} // RNETWORK-ALLOWLIST enforced
let packet=null, outbox=JSON.parse(localStorage.getItem('rklowd3-outbox')||'[]');
const out=t=>document.getElementById('out').textContent=t;
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function signals(){
 const s={seat:'17e',ts:new Date().toISOString(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone,ua:navigator.userAgent,online:navigator.onLine,lang:navigator.language,screen:[screen.width,screen.height,devicePixelRatio],touch:navigator.maxTouchPoints};
 try{const b=await navigator.getBattery();s.battery={level:b.level,charging:b.charging}}catch(e){}
 try{s.connection=navigator.connection?{type:navigator.connection.effectiveType,downlink:navigator.connection.downlink,rtt:navigator.connection.rtt}:null}catch(e){}
 try{const p=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000}));s.location={lat:p.coords.latitude,lon:p.coords.longitude,acc_m:p.coords.accuracy}}catch(e){s.location='not granted / unavailable: '+e.message}
 return s}
async function scanAll(){const s=await signals();const body=JSON.stringify(s);packet={type:'RTOR-SIGNAL-17E',v:'rklowd3-0.1',sha256:await sha(body),signal:s};outbox.push(packet);localStorage.setItem('rklowd3-outbox',JSON.stringify(outbox));out('SIGNAL PACKET QUEUED IN OUTBOX\nsha256 '+packet.sha256+'\n\n'+JSON.stringify(s,null,2)+'\n\nOUTBOX packets waiting: '+outbox.length)}
async function fetchJSON(u){const r=await fetch(u,{cache:'no-store'});return {status:r.status,bytes:(await r.clone().text()).length,text:await r.text()}}
async function monitor(){try{const f=await fetch('https://rizal.pw/rtor/feed.json',{cache:'no-store'});const t=await f.text();out('RTOR FEED status '+f.status+' · '+t.length+' B · sha256 '+await sha(t)+'\nFirst 600 chars:\n'+t.slice(0,600))}catch(e){out('RTOR fetch failed (CORS/offline): '+e.message+'\nPacket stays in OUTBOX — store-and-forward, nothing lost.')}}
