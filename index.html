<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Я" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>Я AIᵐ</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
  <meta property="og:title" content="Я AIᵐ" />
  <meta property="og:description" content="Offline-first conversational AI. Memory. Downloadable logs. Evolves." />
  <meta property="og:image" content="./logo.jpeg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:image" content="./logo.jpeg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo"><img src="./icon-192.png" alt="Я" width="40" height="40" /></div>
      <div class="wordmark">AIᵐ · v0</div>
    </div>
    <div class="status">
      <span class="dot" id="net-dot"></span>
      <span id="net-label">local engine</span>
    </div>
    <div class="actions">
      <button class="icon" id="open-panel" title="Я"><img src="./favicon-32.png" alt="Я" width="32" height="32" /></button>
    </div>
  </header>
  <main id="log"></main>
  <form class="composer" id="composer">
    <input id="input" autocomplete="off" placeholder="Speak to Я" />
    <button type="submit">Send</button>
  </form>
  <aside class="panel" id="panel">
    <div class="sheet">
      <h2>Я</h2>
      <p class="lead">Offline from the start. You mint the Essence. You download it whenever you want.</p>
      <label class="field">Your name
        <input id="name-input" />
      </label>
      <p class="lead">Creator key <span id="creator-id">…</span> — generated on this device, never sent.</p>
      <div class="downloads">
        <button id="mint-now">Mint Essence</button>
        <button id="dl-txt">Log .txt</button>
        <button id="dl-md">Log .md</button>
        <button id="dl-json">Log .json</button>
      </div>
      <h3 style="margin: 8px 0 4px; font-weight: 500;">Vault</h3>
      <div id="vault-list"></div>
      <h3 style="margin: 8px 0 4px; font-weight: 500;">Functions</h3>
      <div id="fn-list"></div>
      <div class="downloads" style="margin-top: 22px;">
        <button id="clear-chat">Clear chat</button>
        <button id="reset-all">Reset Essence</button>
      </div>
    </div>
  </aside>
  <script src="./app.js"></script>
</body>
</html>
