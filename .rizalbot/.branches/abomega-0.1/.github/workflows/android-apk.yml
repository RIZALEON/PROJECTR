name: ABOMEGA Android APK
on:
  push:
    branches: [abomega-0.1, main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abomega-0.1-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Attach APK to release
        if: github.ref == 'refs/heads/abomega-0.1'
        continue-on-error: true
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          gh release upload abomega-0.1 "$APK" --repo "${{ github.repository }}" --clobber || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
